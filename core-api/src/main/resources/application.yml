spring:
  application:
    name: career-radar-core-api
  config:
    # Local development convenience: values from infra/.env are loaded as properties.
    # Real deployments should provide plain environment variables instead.
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:./infra/.env[.properties]
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:career_radar}}
    username: ${POSTGRES_USER:career}
    password: ${POSTGRES_PASSWORD:career}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

internal:
  # Shared secret for /internal/** (collector -> core-api). Empty means "fail closed".
  token: ${INTERNAL_TOKEN:}

security:
  jwt:
    # Required: random value of at least 32 bytes. Changing it invalidates every token.
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

app:
  user:
    # Single user of this personal tool. Generate the hash with:
    #   ./gradlew :core-api:hashPassword
    email: ${APP_USER_EMAIL:}
    password-hash: ${APP_USER_PASSWORD_HASH:}

career-radar:
  llm:
    # OpenAI-compatible base URL, including the version segment (e.g. https://host/v1).
    base-url: ${OPENCODE_GO_BASE_URL:}
    api-key: ${OPENCODE_GO_API_KEY:}
    # Stable per-conversation id for OpenCode Go routing and prompt caching.
    session-id: ${OPENCODE_GO_SESSION_ID:career-radar-local}
    default-model: ${LLM_DEFAULT_MODEL:deepseek-v4.1-flash}
    writing-model: ${LLM_WRITING_MODEL:deepseek-v4-pro}
    classification-model: ${LLM_CLASSIFICATION_MODEL:claude-haiku-5-5}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
    max-retries: ${LLM_MAX_RETRIES:2}
    cache-ttl-hours: ${LLM_CACHE_TTL_HOURS:168}
    # Optional per-1M-token prices. OpenCode Go does not publish them, so the default is 0;
    # token counts and latency are recorded either way.
    pricing:
      - model: deepseek-v4.1-flash
        input-per-million: ${LLM_FLASH_INPUT_PRICE:0}
        output-per-million: ${LLM_FLASH_OUTPUT_PRICE:0}
      - model: deepseek-v4-pro
        input-per-million: ${LLM_PRO_INPUT_PRICE:0}
        output-per-million: ${LLM_PRO_OUTPUT_PRICE:0}
  resume-storage:
    dir: ${RESUME_FILES_DIR:./data/resumes}
    max-bytes: ${RESUME_MAX_BYTES:10485760}

server:
  port: ${CORE_API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.careerradar: INFO
