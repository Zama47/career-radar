spring:
  application:
    name: career-radar-core-api
  config:
    # Local development convenience: values from infra/.env are loaded as properties.
    # Real deployments should provide plain environment variables instead.
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:./infra/.env[.properties]
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:career_radar}}
    username: ${POSTGRES_USER:career}
    password: ${POSTGRES_PASSWORD:career}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

internal:
  # Shared secret for /internal/** (collector -> core-api). Empty means "fail closed".
  token: ${INTERNAL_TOKEN:}

security:
  jwt:
    # Required: random value of at least 32 bytes. Changing it invalidates every token.
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

app:
  user:
    # Single user of this personal tool. Generate the hash with:
    #   ./gradlew :core-api:hashPassword
    email: ${APP_USER_EMAIL:}
    password-hash: ${APP_USER_PASSWORD_HASH:}

server:
  port: ${CORE_API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.careerradar: INFO
